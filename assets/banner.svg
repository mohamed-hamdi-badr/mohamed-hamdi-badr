<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#374151" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="18" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="18" fill="url(#grid)" />

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="1200" height="5" rx="2" fill="url(#accentGrad)" />

  <!-- Decorative Glowing Orbs -->
  <circle cx="1050" cy="70" r="140" fill="#38BDF8" opacity="0.08" />
  <circle cx="150" cy="260" r="160" fill="#818CF8" opacity="0.08" />

  <!-- Left Content: Name, Title & Certification Badges -->
  <g transform="translate(60, 62)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="350" height="30" rx="15" fill="#064E3B" stroke="#10B981" stroke-width="1.2" opacity="0.9" />
    <circle cx="18" cy="15" r="5" fill="#34D399" />
    <text x="34" y="20" font-family="'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#A7F3D0" letter-spacing="0.5">
      DUAL ISTQB® CERTIFIED QA ENGINEER
    </text>

    <!-- Main Name -->
    <text x="0" y="82" font-family="'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
      Mohamed Hamdi Badr
    </text>

    <!-- Subtitle -->
    <text x="0" y="118" font-family="'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#38BDF8">
      Software Quality Assurance &amp; Test Engineer
    </text>

    <!-- Core Pillars -->
    <text x="0" y="152" font-family="'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#D1D5DB">
      Manual &amp; Agile QA  •  REST API Testing (Postman / Bruno)  •  Apache JMeter Load Testing  •  SQL &amp; Selenium
    </text>

    <!-- Bottom Metric Pills -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="175" height="42" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
      <text x="16" y="26" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#38BDF8">1,450+</text>
      <text x="68" y="26" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="500" fill="#E5E7EB">Test Cases</text>

      <rect x="190" y="0" width="185" height="42" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
      <text x="206" y="26" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#818CF8">140+</text>
      <text x="248" y="26" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="500" fill="#E5E7EB">APIs Validated</text>

      <rect x="390" y="0" width="205" height="42" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
      <text x="406" y="26" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#34D399">13+</text>
      <text x="438" y="26" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="500" fill="#E5E7EB">Production Systems</text>

      <rect x="610" y="0" width="195" height="42" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
      <text x="626" y="26" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#FBBF24">4 Countries</text>
      <text x="712" y="26" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="500" fill="#E5E7EB">EG•SA•KW•AE</text>
    </g>
  </g>

  <!-- Right Side: QA Terminal / Verification Graphic -->
  <g transform="translate(895, 48)">
    <rect x="0" y="0" width="250" height="224" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <!-- Terminal Top Bar -->
    <rect x="0" y="0" width="250" height="32" rx="14" fill="#1E293B" />
    <circle cx="18" cy="16" r="5" fill="#EF4444" />
    <circle cx="34" cy="16" r="5" fill="#F59E0B" />
    <circle cx="50" cy="16" r="5" fill="#10B981" />
    <text x="82" y="20" font-family="Consolas, monospace" font-size="11.5" font-weight="600" fill="#94A3B8">qa-suite — pass</text>

    <!-- Terminal Lines -->
    <text x="18" y="58" font-family="Consolas, monospace" font-size="12" fill="#34D399">✓ ISTQB CTFL v4.0</text>
    <text x="18" y="82" font-family="Consolas, monospace" font-size="12" fill="#34D399">✓ ISTQB Mobile (CT-MAT)</text>
    <text x="18" y="106" font-family="Consolas, monospace" font-size="12" fill="#38BDF8">✓ REST API Schema [200]</text>
    <text x="18" y="130" font-family="Consolas, monospace" font-size="12" fill="#38BDF8">✓ JMeter 500 VU Load</text>
    <text x="18" y="154" font-family="Consolas, monospace" font-size="12" fill="#818CF8">✓ SQL Ledger Audit</text>
    <text x="18" y="178" font-family="Consolas, monospace" font-size="12" fill="#FBBF24">✓ Selenium POM Suite</text>
    <rect x="18" y="194" width="214" height="18" rx="4" fill="#064E3B" />
    <text x="28" y="207" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#6EE7B7">STATUS: 0 DEFECT LEAKAGE</text>
  </g>
</svg>
